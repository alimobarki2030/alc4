, {"e": "much", "a": "كثير (غير معدود)"}];
const ROUND = 10;
let order=[], idx=0, correct=0, answered=false, curWord=null, cur=null;

function _slug(t){return String(t).replace(/\(.*?\)/g,'').trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');}
function play(w){
  const s=_slug(w);
  if(typeof AUDIO_INDEX!=='undefined' && AUDIO_INDEX.has(s)){
    if(cur){try{cur.pause();}catch(e){}}
    const a=new Audio('audio/en/'+s+'.mp3'); cur=a;
    a.play().catch(()=>tts(w));
  } else tts(w);
}
function tts(w){ if(window.speechSynthesis){const u=new SpeechSynthesisUtterance(w);u.lang='en-US';speechSynthesis.cancel();speechSynthesis.speak(u);} }

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function start(){
  order=shuffle(POOL.slice()).slice(0,ROUND);
  idx=0;correct=0;render();
}
function render(){
  const s=document.getElementById('stage');
  document.getElementById('score').textContent=correct+' / '+ROUND;
  document.getElementById('fill').style.width=(idx/ROUND*100)+'%';
  if(idx>=ROUND){
    document.getElementById('fill').style.width='100%';
    s.innerHTML='<div class="la-done"><div class="emoji">'+(correct>=8?'🏆':(correct>=5?'👍':'📚'))+
      '</div><h2>أحسنت! أكملت الجولة</h2><p>نتيجتك: '+correct+' / '+ROUND+'</p>'+
      '<button class="la-again" onclick="start()">🔁 مرة أخرى</button></div>';
    return;
  }
  answered=false;
  const q=order[idx];curWord=q;
  // 3 distractor meanings
  const others=shuffle(POOL.filter(w=>w.e!==q.e)).slice(0,3);
  const opts=shuffle([q,...others]);
  s.innerHTML=
    '<div class="la-play"><button class="la-btn" id="playbtn" aria-label="استمع">'+
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4.7a.7.7 0 0 0-1.2-.5L6.4 7.6A1.4 1.4 0 0 1 5.4 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.4a1.4 1.4 0 0 1 1 .4l3.4 3.4a.7.7 0 0 0 1.2-.5z"/><path d="M16 9a5 5 0 0 1 0 6"/><path d="M19.4 5.6a9 9 0 0 1 0 12.7"/></svg>'+
    '</button><div class="la-hint">اضغط للاستماع، ثم اختر المعنى</div></div>'+
    '<div class="la-opts" id="opts">'+opts.map(o=>
      '<button class="la-opt" onclick="pick(this,'+(o.e===q.e?'1':'0')+')">'+o.a+'</button>').join('')+'</div>'+
    '<div class="la-reveal" id="reveal"></div>'+
    '<button class="la-next" id="next" onclick="idx++;render();">التالي ←</button>';
  document.getElementById('playbtn').onclick=()=>play(q.e);
  setTimeout(()=>play(q.e),350);
}
function pick(btn,isCorrect){
  if(answered)return; answered=true;
  document.querySelectorAll('.la-opt').forEach(b=>{b.disabled=true;});
  if(isCorrect){btn.classList.add('ok');correct++;}
  else{
    btn.classList.add('no');
    document.querySelectorAll('.la-opt').forEach(b=>{if(b.textContent===curWord.a)b.classList.add('ok');});
  }
  const rev=document.getElementById('reveal');
  rev.innerHTML='<b dir="ltr">'+curWord.e+'</b> = '+curWord.a;
  rev.style.display='block';
  document.getElementById('score').textContent=correct+' / '+ROUND;
  document.getElementById('next').style.display='block';
}
start();
