<style>
  .la-wrap{max-width:640px;margin:0 auto;padding:0 16px 60px}
  .la-nav{display:flex;align-items:center;justify-content:space-between;padding:16px 0 6px}
  .la-back{display:inline-flex;align-items:center;gap:7px;color:var(--muted);text-decoration:none;font-weight:700;font-size:.9rem;padding:8px 12px;border-radius:10px;border:1px solid var(--bdr);background:var(--card)}
  .la-back:hover{color:var(--txt)}
  .la-logo{font-family:'Inter',sans-serif;font-weight:800;color:var(--txt);letter-spacing:.5px}
  .la-logo span{color:var(--g)}
  .la-head{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 12px}
  .la-title{font-size:1.4rem;font-weight:900;color:var(--txt)}
  .la-score{font-size:.85rem;font-weight:800;color:var(--muted)}
  .la-prog{height:8px;background:var(--bdr);border-radius:100px;overflow:hidden;margin-bottom:20px}
  .la-fill{height:100%;background:var(--g);border-radius:100px;transition:width .3s;width:0}
  .la-play{display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bdr);border-radius:20px;padding:26px 20px;box-shadow:0 12px 30px rgba(26,39,68,.10)}
  .la-btn{width:92px;height:92px;border-radius:50%;border:none;cursor:pointer;background:linear-gradient(135deg,#1CB0F6,#0A96DC);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(28,176,246,.4);transition:transform .12s}
  .la-btn:hover{transform:scale(1.05)}.la-btn:active{transform:scale(.96)}
  .la-btn svg{width:42px;height:42px}
  .la-hint{color:var(--muted);font-size:.85rem;font-weight:700}
  .la-num{color:var(--muted);font-weight:800;font-size:.85rem;margin:2px 2px 10px}
  .la-opts{display:flex;flex-direction:column;gap:10px;margin-top:18px}
  .la-opt{display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--bdr);border-radius:14px;padding:14px 16px;font-family:'Inter',sans-serif;direction:ltr;text-align:left;font-size:1rem;font-weight:600;color:var(--txt);cursor:pointer;transition:all .12s}
  .la-opt:hover:not(:disabled){border-color:var(--b);transform:translateY(-1px)}
  .la-opt:disabled{cursor:default}
  .la-opt .ltr-badge{flex:none;width:26px;height:26px;border-radius:7px;background:var(--bg);border:1px solid var(--bdr);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.8rem;color:var(--muted)}
  .la-opt.ok{background:var(--ok-bg);border-color:var(--ok-txt);color:var(--ok-txt)}
  .la-opt.ok .ltr-badge{background:var(--ok-txt);color:#fff;border-color:var(--ok-txt)}
  .la-opt.no{background:var(--no-bg);border-color:var(--no-txt);color:var(--no-txt)}
  .la-next{width:100%;margin-top:16px;background:var(--g);color:#fff;border:none;border-radius:14px;padding:15px;font-family:'Cairo',sans-serif;font-weight:900;font-size:1rem;cursor:pointer;display:none}
  .la-done{text-align:center;background:var(--card);border:1px solid var(--bdr);border-radius:20px;padding:36px 20px;box-shadow:0 12px 30px rgba(26,39,68,.10)}
  .la-done .emoji{font-size:3rem}
  .la-done h2{font-size:1.3rem;color:var(--txt);margin:10px 0 4px}
  .la-done p{color:var(--muted);font-weight:800;font-size:1.1rem;margin-bottom:18px}
  .la-again{background:var(--b);color:#fff;border:none;border-radius:12px;padding:13px 28px;font-family:'Cairo',sans-serif;font-weight:900;font-size:1rem;cursor:pointer}
</style>
</head>
<body>
<div class="la-wrap">
  <div class="la-nav"><a class="la-back" href="/">→ الرئيسية</a><div class="la-logo">AL<span>C</span></div></div>
  <div class="la-head"><div class="la-title">اختبار الاستماع A1</div><div class="la-score" id="score">0 / 10</div></div>
  <div class="la-prog"><div class="la-fill" id="fill"></div></div>
  <div id="stage"></div>
</div>
<script>
const DATA = [{"id": "p1", "q": "What time does Tom get up?", "o": ["five o'clock", "six o'clock", "seven o'clock", "eight o'clock"], "a": 1}, {"id": "p2", "q": "How much is the shirt?", "o": ["five dollars", "ten dollars", "fifteen dollars", "twenty dollars"], "a": 1}, {"id": "p3", "q": "Where is the bank?", "o": ["next to the school", "next to the post office", "behind the store", "near the hospital"], "a": 1}, {"id": "p4", "q": "What does Ali's sister do?", "o": ["She is a doctor.", "She is a nurse.", "She is a teacher.", "She is a student."], "a": 2}, {"id": "p5", "q": "What is the weather like today?", "o": ["It is sunny.", "It is hot.", "It is rainy.", "It is windy."], "a": 2}, {"id": "p6", "q": "When does the train leave?", "o": ["at seven o'clock", "at eight o'clock", "at nine o'clock", "at ten o'clock"], "a": 1}, {"id": "p7", "q": "Why is John staying home?", "o": ["He is tired.", "He is busy.", "He is sick.", "He is happy."], "a": 2}, {"id": "p8", "q": "What does Lisa do at the gym?", "o": ["She runs.", "She swims.", "She reads.", "She sleeps."], "a": 1}, {"id": "p9", "q": "What kind of food does the restaurant serve?", "o": ["Chinese food", "Arabic food", "Italian food", "French food"], "a": 2}, {"id": "p10", "q": "When is David flying to New York?", "o": ["on Monday", "on Wednesday", "on Friday", "on Sunday"], "a": 2}, {"id": "p11", "q": "What does Nora drink every morning?", "o": ["coffee", "tea", "juice", "milk"], "a": 1}, {"id": "p12", "q": "Where is the library?", "o": ["on the first floor", "on the second floor", "on the third floor", "next to the door"], "a": 1}, {"id": "p13", "q": "What is Sami studying?", "o": ["math", "science", "English", "history"], "a": 2}, {"id": "p14", "q": "Where is Kate going?", "o": ["to the bank", "to the coffee shop", "to the hospital", "to school"], "a": 1}, {"id": "p15", "q": "What color is the car?", "o": ["blue", "black", "red", "white"], "a": 2}, {"id": "p16", "q": "When does Mark rest?", "o": ["on Monday and Tuesday", "on Friday and Saturday", "every day", "on Sunday only"], "a": 1}, {"id": "p17", "q": "Who is Emma going to see?", "o": ["a teacher", "a nurse", "a doctor", "a friend"], "a": 2}, {"id": "p18", "q": "How many apples is Omar buying?", "o": ["one", "two", "three", "four"], "a": 2}, {"id": "p19", "q": "Where is the plane coming from?", "o": ["from Paris", "from London", "from Rome", "from Cairo"], "a": 1}, {"id": "p20", "q": "What are Hana's favorite books about?", "o": ["cars", "sports", "animals", "food"], "a": 2}, {"id": "p21", "q": "What is the weather like today?", "o": ["hot", "warm", "cold", "sunny"], "a": 2}, {"id": "p22", "q": "What time is the meeting?", "o": ["at nine o'clock", "at ten o'clock", "at eleven o'clock", "at twelve o'clock"], "a": 1}, {"id": "p23", "q": "What does Yusuf want?", "o": ["a glass of water", "a cup of tea", "some food", "a book"], "a": 0}, {"id": "p24", "q": "When is the school closed?", "o": ["on Monday", "on Friday", "on Sunday", "on Saturday"], "a": 2}, {"id": "p25", "q": "Who gave Layla the phone?", "o": ["her mother", "her father", "her sister", "her friend"], "a": 1}, {"id": "p26", "q": "What does the store sell?", "o": ["food", "books", "shoes and clothes", "cars"], "a": 2}, {"id": "p27", "q": "What time does Ahmed wake up?", "o": ["at five", "at six", "at seven", "at ten"], "a": 1}, {"id": "p28", "q": "Where is the hotel?", "o": ["near the mountain", "near the beach", "in the city center", "next to the airport"], "a": 1}, {"id": "p29", "q": "What is Fatima making for dinner?", "o": ["fish and bread", "rice and chicken", "soup and salad", "eggs and cheese"], "a": 1}, {"id": "p30", "q": "Where are the students waiting?", "o": ["at the school", "at the bus stop", "at home", "at the store"], "a": 1}];
const ROUND = 10;
let order=[], idx=0, correct=0, answered=false, cur=null, curItem=null;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function play(id){
  if(cur){try{cur.pause();}catch(e){}}
  const a=new Audio('audio/listen/'+id+'.mp3'); cur=a; a.play().catch(()=>{});
}
function start(){order=shuffle(DATA.slice()).slice(0,ROUND);idx=0;correct=0;render();}
function render(){
  const s=document.getElementById('stage');
  document.getElementById('score').textContent=correct+' / '+ROUND;
  document.getElementById('fill').style.width=(idx/ROUND*100)+'%';
  if(idx>=ROUND){
    document.getElementById('fill').style.width='100%';
    s.innerHTML='<div class="la-done"><div class="emoji">'+(correct>=8?'🏆':(correct>=5?'👍':'📚'))+'</div><h2>انتهى الاختبار</h2><p>نتيجتك: '+correct+' / '+ROUND+'</p><button class="la-again" onclick="start()">🔁 اختبار جديد</button></div>';
    return;
  }
  answered=false;
  const it=order[idx]; curItem=it;
  const L=['A','B','C','D'];
  s.innerHTML=
    '<div class="la-play"><button class="la-btn" id="pb" aria-label="استمع"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4.7a.7.7 0 0 0-1.2-.5L6.4 7.6A1.4 1.4 0 0 1 5.4 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.4a1.4 1.4 0 0 1 1 .4l3.4 3.4a.7.7 0 0 0 1.2-.5z"/><path d="M16 9a5 5 0 0 1 0 6"/><path d="M19.4 5.6a9 9 0 0 1 0 12.7"/></svg></button><div class="la-hint">🔊 استمع (الفقرة + السؤال)، ثم اختر الإجابة</div></div>'+
    '<div class="la-opts" id="opts">'+it.o.map((o,oi)=>'<button class="la-opt" dir="ltr" onclick="pick(this,'+oi+')"><span class="ltr-badge">'+L[oi]+'</span><span>'+o+'</span></button>').join('')+'</div>'+
    '<button class="la-next" id="next" onclick="idx++;render();">التالي ←</button>';
  document.getElementById('pb').onclick=()=>play(it.id);
  setTimeout(()=>play(it.id),400);
}
function pick(btn,oi){
  if(answered)return; answered=true;
  const opts=document.querySelectorAll('.la-opt'); opts.forEach(b=>b.disabled=true);
  if(oi===curItem.a){btn.classList.add('ok');correct++;}
  else{btn.classList.add('no');opts[curItem.a].classList.add('ok');}
  document.getElementById('score').textContent=correct+' / '+ROUND;
  document.getElementById('next').style.display='block';
}
start();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));}</script>
